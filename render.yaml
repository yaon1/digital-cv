# Render Blueprint: веб-сервис (Docker) + PostgreSQL, бесплатный тариф
services:
  - type: web
    name: digital-cv
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-cv-db
          property: connectionString
databases:
  - name: digital-cv-db
    plan: free
    databaseName: cv
    user: cv
